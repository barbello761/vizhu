    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

    <title>ВИЖУ</title>

    <style>
      /* ─── Заставка ────────────────────────────────────────────────────────
         Экран «Прелоадер» из макета. Живёт до монтирования React — поэтому
         только CSS и инлайновый SVG: ни бандла, ни шрифтов приложения на этот
         момент ещё нет. React снимает её через main.tsx (класс `hidden`).

         Фон в макете — шейдер «moving gradient»: перетекающая синяя сетка
         (Preloader.webm). Оригинал (2.7 МБ) пережат в крошечное видео
         (240px, 20 fps, VP9 ~15 КБ / H.264 ~35 КБ) и лежит поверх статичного
         синего градиента-подложки — тот виден, пока видео грузится, и на
         устройствах с `prefers-reduced-motion`.
      ──────────────────────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @font-face {
        font-family: 'Onest Rounded';
        font-style: normal;
        font-weight: 500;
        src:
          url('/assets/fonts/OnestRounded-Medium.woff2') format('woff2'),
          url('/assets/fonts/OnestRounded-Medium.ttf') format('truetype');
        font-display: swap;
      }

      /* Синий прелоадера держим и на html, и на body: первый кадр (до применения
         бандла и до монтирования React) должен быть сразу синим, без вспышки
         белого/чёрного. Фон приложения (#root) перекроет это после старта. */
      html,
      body {
        margin: 0;
        background: #0a25a9;
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: 'Onest Rounded', 'Onest', ui-sans-serif, system-ui, sans-serif;

        /* Базовый синий — под всеми перетекающими пятнами, полностью непрозрачен. */
        background-color: #05207f;
        background-image: radial-gradient(
          120% 120% at 50% 0%,
          #0d38c0 0%,
          #041a72 60%,
          #03135a 100%
        );
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      #app-preloader.hidden {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      /* ── Фоновое видео ───────────────────────────────────────────────────
         Пережатый макетный шейдер «moving gradient». Апскейл с 240px
         сглаживаем размытием; scale(1.08) прячет мягкий край от blur.

         opacity: 0 до события `playing` — принципиально. Пока видео не
         заиграло, Android WebView рисует на его месте свою заглушку (белый
         фон с кнопкой «плей» во весь экран). Показываем элемент только когда
         кадры реально пошли; если автоплей запрещён — под ним остаётся
         статичный градиент, и заглушка не видна вообще. Плюс poster 1×1
         в цвет фона — на случай, если WebView рисует заглушку ещё раньше. */
      .pre-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        background-color: #05207f;
        opacity: 0;
        filter: blur(6px);
        transform: scale(1.08);
        transition: opacity 0.5s ease;
      }

      .pre-video.is-playing {
        opacity: 1;
      }

      .pre-center {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;

        /* Space/related из токенов макета. */
        gap: 12px;
        animation: pre-appear 0.6s ease-out both;
      }

      .pre-logo {
        display: block;
        width: 209px;
        height: 80px;
        max-width: 60vw;
        color: #fff;
      }

      .pre-subtitle {
        margin: 0;

        /* Body Regular из токенов макета. */
        font-size: 20px;
        font-weight: 500;
        line-height: 30px;
        color: #fff;
      }

      @keyframes pre-appear {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      .pre-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: nowrap;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
      }

      @media (prefers-reduced-motion: reduce) {
        .pre-center {
          animation: none;
        }

        /* Без движущегося фона — остаётся статичный градиент-подложка. */
        .pre-video {
          display: none;
        }
      }
    </style>
  </head>
