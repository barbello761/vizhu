# Локальный дев. Запуск из папки infra/:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Ведёт себя как прод; все отличия (своя БД, без TLS, фикс-код OTP) — здесь.

services:

  nginx:
    volumes:
      # ВМЕСТО базового ./nginx/conf.d: смонтировать файл внутрь :ro-папки
      # docker не может — "make mountpoint: read-only file system".
      - ./nginx/conf.d.dev:/etc/nginx/conf.d:ro
    ports:
      - "80:80"

  front:
    image: vizhu-front:dev
    build:
      target: development
    volumes:
      - ../front:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DOCKER_DEV: "1"
      # Относительный путь, как в front/.env.production: один origin, без CORS.
      VITE_API_URL: /api
      VITE_SOCKET_URL: ""
      # Для входа через :5174 в обход nginx. Внутри контейнера localhost —
      # это сам фронт, поэтому цель прокси именно по имени сервиса.
      VITE_DEV_PROXY_TARGET: http://api:3000
      VITE_APP_TITLE: ВИЖУ (dev)
      VITE_APP_ENV: development
      VITE_ENABLE_DEVTOOLS: "true"
      VITE_ENABLE_MOCKS: "false"
    # Отладка HMR в обход nginx. 5174, а не 5173: тот оставлен свободным
    # под `npm run dev` без докера.
    ports:
      - "5174:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  landing:
    image: vizhu-landing:dev
    build:
      target: development
    volumes:
      - ../landing:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  api:
    image: vizhu-api:dev
    build:
      target: development
    volumes:
      - ../api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vizhu:devpassword@postgres:5432/vizhu
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: dev_secret_not_for_prod
      # Локальный LiveKit. Для фронта — localhost: браузер живёт на хосте.
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_URL: ws://localhost:7880
      # Фикс-код входа вместо платного звонка. Пусто — настоящая доставка.
      OTP_BYPASS: "${OTP_BYPASS:-}"
      MATCHING_BACKEND: "${MATCHING_BACKEND:-memory}"
    ports:
      - "3000:3000"
    command: npm run start:dev

  ai:
    image: vizhu-ai:dev
    volumes:
      - ../ai:/app
    environment:
      RELOAD: "true"
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  livekit:
    # В базовом compose зашит --node-ip прод-сервера: локально ICE не сойдётся.
    command: --config /etc/livekit/livekit.yaml --node-ip 127.0.0.1
    ports:
      - "7880:7880"

  postgres:
    environment:
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

networks:
  # На проде — внешняя сеть общего реверс-прокси, локально её никто не создаёт.
  shared-web:
    external: false
    name: vizhu_shared_web_dev

volumes:
  # Свой том: общий инициализирован прод-паролем, а POSTGRES_PASSWORD
  # действует только при первой инициализации кластера.
  postgres_data:
    name: vizhu_postgres_data_dev
  redis_data:
    name: vizhu_redis_data_dev
