# Демо-стенд demo.vizhu.su. Контейнеры — отдельный compose-проект infra/demo,
# до них прод-nginx достаёт через общую сеть shared-web.
#
# Апстримы заданы переменными + resolver, а не прямым proxy_pass: иначе nginx
# резолвит имена при старте, и пока стенд не поднят (или уже снесён) падал бы
# ВЕСЬ прод-nginx с «host not found in upstream». Так демо просто отдаёт 503.
#
# Сносится вместе со стендом — см. infra/demo/README.md.

server {
    listen 80;
    server_name demo.vizhu.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name demo.vizhu.su;

    ssl_certificate     /etc/letsencrypt/live/demo.vizhu.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.vizhu.su/privkey.pem;

    ssl_protocols     TLSv1.2 TLSv1.3;
    ssl_ciphers       HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # Временный стенд — поисковикам нечего индексировать.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Встроенный DNS докера.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_front http://vizhu_demo_front:80;
    set $demo_api   http://vizhu_demo_api:3000;

    # Стенд не запущен → резолвер/коннект дают 502/504 → понятная заглушка.
    error_page 502 504 = @demo_offline;

    location @demo_offline {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="ru"><meta name="viewport" content="width=device-width"><title>ВИЖУ — демо недоступно</title><main style="font:18px/1.5 system-ui;max-width:32em;margin:15vh auto;padding:0 1em"><h1>Демонстрация сейчас недоступна</h1><p>Основное приложение: <a href="https://app.vizhu.su">app.vizhu.su</a></p></main></html>';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         $demo_front;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # С переменной proxy_pass не срезает префикс сам — делаем rewrite'ом.
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    location /ws/ {
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /rtc/ {
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
