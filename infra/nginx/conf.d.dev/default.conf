# Локальный дев. Монтируется ВМЕСТО всей conf.d.
# Отличий от прода ровно два: нет TLS и нет редиректа на https.

# Апстримы зеркалят app.vizhu.su.conf. map легален: conf.d включается в http{}.
# Нужен, чтобы Connection: upgrade получал только HMR-вебсокет, а не всё подряд.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Встроенный DNS докера.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Фронт: vite dev-сервер (в проде здесь статика из nginx-контейнера front)
    location / {
        set                $upstream_front http://front:5173;
        proxy_pass         $upstream_front;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Vite HMR ходит вебсокетом по тому же location
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Swagger
    location /docs {
        set                $upstream_api http://api:3000;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set                $upstream_api http://api:3000;
        # Через переменную proxy_pass не срезает префикс сам — делаем rewrite'ом.
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        set                $upstream_api http://api:3000;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    location /ws/ {
        set                $upstream_api http://api:3000;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /rtc/ {
        set                $upstream_api http://api:3000;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
